version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: civicduty-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicduty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicduty_secret}
      POSTGRES_DB: ${POSTGRES_DB:-civicduty}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicduty"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicduty-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: civicduty-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicduty-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio
    container_name: civicduty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - civicduty-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicduty-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-civicduty}:${POSTGRES_PASSWORD:-civicduty_secret}@db:5432/${POSTGRES_DB:-civicduty}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=civicduty-media
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost,http://localhost:4200,http://frontend
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - civicduty-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicduty-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-civicduty}:${POSTGRES_PASSWORD:-civicduty_secret}@db:5432/${POSTGRES_DB:-civicduty}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=civicduty-media
    depends_on:
      - backend
      - redis
    networks:
      - civicduty-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicduty-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - civicduty-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  civicduty-network:
    driver: bridge
